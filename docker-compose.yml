services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        trap 'kill $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        until ollama pull "$$MODEL"; do echo "Ollama pull failed, retrying in 5s..."; sleep 5; done
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -qF \"$$MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 15s
    # Для NVIDIA GPU раскомментируйте (нужен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      OLLAMA_URL: http://ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_MODEL:-gemma3:4b}

volumes:
  redis-data:
  ollama-data: